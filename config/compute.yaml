compute:
  data_backend: "duckdb_polars_arrow"
  production_pandas_allowed: false
  numerical_backend: "pytorch"
  rapids_enabled: false
  wsl_required: false

  cuda:
    enabled_for:
      - "pirs_hsic_exact"
      - "pirs_hsic_nystrom"
      - "pirs_hsic_rff"
      - "race_bridge_posterior"
      - "race_bridge_tensor_embedded"
      - "stdfm_solver"
      # POP-02 GPU: the dense per-block population SPG solve now has a WIRED torch path
      # (denominators/reconstruction/torch_solver.py, dispatched from projected_gradient.
      # solve_projected_gradient_small). float32 is safe here (squared residuals + ILR log, no eigh/
      # log-det); recovery validated to ~3e-7/cell vs the CPU reference; ~16x faster per block; CPU
      # fallback on any CUDA error. The build stays locality-blocked (O(block) RAM); GPU only
      # accelerates the inner solve.
      - "population_solver"
    require_cuda_for_region_hsic: true
    dtype: "float32"
    max_vram_fraction: 0.80
