datasus:
  r_library_path: ".r-library"
  backend: "microdatasus"
  rscript_path: "Rscript"
  preserve_raw: true
  preserve_processed: true
  r_timeout_seconds: 7200
  heartbeat_timeout_seconds: 900
  max_parallel_requests: 16

  systems:
    - "SIM-DO"
    - "SINASC"
    - "SIH-RD"
    - "CNES-ST"

  chunking:
    SIM-DO: "uf_year"
    SINASC: "uf_year"
    SIH-RD: "uf_year_or_month_by_size"
    CNES-ST: "uf_month_or_year_by_source"

  # Earliest period each system exists in DATASUS. The planner does NOT emit chunk
  # requests before this floor: no file is published there, so a fetch would only spin
  # up a doomed R subprocess to 404. Floors are conservative (at/below the true first
  # availability) so real data is never excluded. CNES establishment (ST) files begin
  # 2005-08; SIM-DO CID-10 from 1996; SINASC nationally from 1994; SIH-RD (reduced AIH)
  # from 1992. Only CNES-ST's floor bites any 2000+ study; the rest predate all requests.
  # first_year/first_month = earliest published; last_year = latest published (publication lag). The
  # planner emits no chunk request outside [first .. last], so strict completeness is not failed by a
  # not-yet-published year. last_year is a point-in-time fact (advances as DATASUS releases) — dated in
  # the comment. Verified 2026-07-10 from the DATASUS FTP directory listing (SIHSUS/SIM/SINASC Dados):
  # SIM-DO complete through 2024; SIH-RD complete through 2024 (bar the RR/AP holes below); SINASC final
  # data (NOV/DNRES) ends at 2022 — DN files for 2023/2024 do not exist for any UF (PRELIM folder empty).
  availability:
    SIM-DO:  {first_year: 1996, last_year: 2024}
    SINASC:  {first_year: 1994, last_year: 2022}
    SIH-RD:  {first_year: 1992, last_year: 2024}
    CNES-ST: {first_year: 2005, first_month: 8}

  # Proven source-file absences inside an otherwise available system window. These
  # are excluded from the strict completeness denominator only at their exact grain.
  known_unavailable:
    SIH-RD:
      - uf: RR
        year: 2000
        months: [1, 2, 3, 4, 5]
        evidence: "DATASUS historical FTP SIHSUS/199201_200712 returned 550 for RDRR0001.dbc through RDRR0005.dbc; verified 2026-07-10"
      - uf: AP
        year: 2007
        months: [10]
        evidence: "DATASUS historical FTP SIHSUS/199201_200712 returned 550 for RDAP0710.dbc; verified 2026-07-10"

  optional_ftp_discovery: false
