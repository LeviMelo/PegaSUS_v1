schema_version: '1.0'
registry_id: carrier_registry_v1
carriers:
  Deaths:
    label: Death events
    description: Individual death events and derived death counts from SIM-DO.
    allowed_units:
    - counts
    default_aggregation: additive
  LiveBirths:
    label: Live birth events
    description: Individual live-birth events, derived live-birth counts, and SINASC marked functional primitives.
    allowed_units:
    - counts
    - grams
    - weeks
    - score
    default_aggregation: additive
  HospitalAdmissions:
    label: Hospital admissions
    description: SIH-RD hospitalization/admission records.
    allowed_units:
    - counts
    - days
    - BRL
    default_aggregation: additive
  Facilities:
    label: Health facilities
    description: CNES-ST establishment/facility-period records.
    allowed_units:
    - counts
    - beds
    - binary_flag
    default_aggregation: additive
  Population:
    label: Population denominator
    description: SIDRA or population-tensor person-year denominator carrier.
    allowed_units:
    - person_years
    - persons
    default_aggregation: additive
  # Observer-process carriers (MSD §3.10.6). σ-restrictions of Deaths by a data-quality /
  # measurement-process property; divided by all-cause Deaths to form observer shares.
  IllDefinedDeaths:
    label: Ill-defined-cause deaths
    description: Deaths with ill-defined underlying cause (R-codes); restriction of Deaths.
    allowed_units: [counts]
    default_aggregation: additive
  InvalidICDDeaths:
    label: Invalid/unparseable ICD deaths
    description: Deaths with invalid or unparseable underlying ICD; restriction of Deaths.
    allowed_units: [counts]
    default_aggregation: additive
  MissingRaceDeaths:
    label: Missing-race deaths
    description: Deaths with missing/unknown administrative race; restriction of Deaths.
    allowed_units: [counts]
    default_aggregation: additive
  InvestigatedDeaths:
    label: Investigated deaths
    description: Deaths flagged as investigated; restriction of Deaths.
    allowed_units: [counts]
    default_aggregation: additive
  # Restricted clinical-event carriers (MSD §2.6, §3.10.4). Derived by σ restriction
  # of a parent carrier; declared here so the engine's carrier knowledge is fully
  # registry-driven (see clinical_event_definitions.yaml).
  InfantDeaths:
    label: Infant deaths
    description: Liveborn deaths under 365.25 days (§2.6.2); restriction of Deaths.
    allowed_units: [counts]
    default_aggregation: additive
  NeonatalDeaths:
    label: Neonatal deaths
    description: Liveborn deaths under 28 days (§2.6.3); restriction of Deaths.
    allowed_units: [counts]
    default_aggregation: additive
  PostNeonatalDeaths:
    label: Postneonatal deaths
    description: Deaths in [28, 365.25) days (§2.6.4); restriction of Deaths.
    allowed_units: [counts]
    default_aggregation: additive
  HospitalDeaths:
    label: Inpatient deaths
    description: SIH in-hospital deaths; restriction of HospitalAdmissions.
    allowed_units: [counts]
    default_aggregation: additive
  DengueHospitalAdmissions:
    label: Dengue hospital admissions
    description: SIH admissions with principal ICD-10 diagnosis A90 or A91; restriction of HospitalAdmissions.
    allowed_units: [counts]
    default_aggregation: additive
  ZikaHospitalAdmissions:
    label: Zika hospital admissions
    description: SIH admissions with principal ICD-10 diagnosis A92.8/U06* zika-compatible coding; restriction of HospitalAdmissions.
    allowed_units: [counts]
    default_aggregation: additive
  ChikungunyaHospitalAdmissions:
    label: Chikungunya hospital admissions
    description: SIH admissions with principal ICD-10 diagnosis A92.0; restriction of HospitalAdmissions.
    allowed_units: [counts]
    default_aggregation: additive
  ArbovirusHospitalAdmissions:
    label: Arbovirus hospital admissions
    description: SIH dengue, zika-compatible, chikungunya, and other mosquito-borne viral fever admissions; restriction of HospitalAdmissions.
    allowed_units: [counts]
    default_aggregation: additive
  LowBirthWeightBirths:
    label: Low-birth-weight births
    description: Live births under 2500 g (§3.10.4); restriction of LiveBirths.
    allowed_units: [counts]
    default_aggregation: additive
  PrematurityBirths:
    label: Preterm births
    description: Live births under 37 weeks (§3.10.4); restriction of LiveBirths.
    allowed_units: [counts]
    default_aggregation: additive
  CongenitalAnomalyBirths:
    label: Congenital anomaly births
    description: Live births with congenital anomaly (§3.10.4); restriction of LiveBirths.
    allowed_units: [counts]
    default_aggregation: additive
  MicrocephalyBirths:
    label: Microcephaly births
    description: Live births with SINASC anomaly ICD-10 Q02*; restriction of LiveBirths.
    allowed_units: [counts]
    default_aggregation: additive
  CesareanBirths:
    label: Cesarean births
    description: Cesarean-delivery live births (§3.10.4 V_C09); restriction of LiveBirths.
    allowed_units: [counts]
    default_aggregation: additive
  LowApgar1Births:
    label: Low 1-minute Apgar births
    description: Live births with Apgar1 < 7 (§3.10.4 V_C10); restriction of LiveBirths.
    allowed_units: [counts]
    default_aggregation: additive
  LowApgar5Births:
    label: Low 5-minute Apgar births
    description: Live births with Apgar5 < 7 (§3.10.4 V_C11); restriction of LiveBirths.
    allowed_units: [counts]
    default_aggregation: additive
  FacilityCapacityVector:
    label: Facility capacity vector
    description: CNES decoded capacity-vector component carrier (§2.7).
    allowed_units: [counts, beds, binary_flag]
    default_aggregation: additive
  HospitalCosts_SH:
    label: Hospital service costs
    description: SIH VAL_SH billing component.
    allowed_units: [BRL, reais_hospital_services]
    default_aggregation: additive
  HospitalCosts_SP:
    label: Professional service costs
    description: SIH VAL_SP billing component.
    allowed_units: [BRL, reais_professional_services]
    default_aggregation: additive
  HospitalCosts_UTI:
    label: ICU service costs
    description: SIH VAL_UTI billing component.
    allowed_units: [BRL, reais_icu_services]
    default_aggregation: additive
  HospitalCosts_TOT:
    label: Total billing costs
    description: SIH VAL_TOT billing component.
    allowed_units: [BRL, reais_total_billing]
    default_aggregation: additive
  ContextCells:
    label: SIDRA contextual cells
    description: Long-form SIDRA contextual fact cells before epidemiological projection.
    allowed_units:
    - raw_sidra_value
    - index
    - percent
    - BRL
    - persons
    - counts
    default_aggregation: non_aggregable
  AuditMetadata:
    label: Audit metadata
    description: Identifiers, hashes, raw JSON payloads, parse states, and other non-analytic metadata.
    allowed_units:
    - identifier
    - state
    - hash
    - json
    - none
    default_aggregation: non_aggregable
entries: {}
