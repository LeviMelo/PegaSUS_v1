schema_version: '1.1'
registry_version: v3.0
created_at: '2026-06-06'
updated_at: '2026-06-26'
provenance: >-
  Source-agnostic clinical event definitions for the EFG (MSD §2.6, §3.10.4).
  This registry is the SINGLE SOURCE OF TRUTH for which event carriers exist,
  which denominators they may be divided by, and what the resulting rate is
  named. The EFG engine (efg/operators.py, efg/dag.py, efg/legality.py) is
  driven by this registry and MUST NOT hardcode carrier or ratio knowledge.
#
# Field contract per entry:
#   event_carrier        canonical carrier produced by the event (§3.3 carrier ontology)
#   event_kind           "primary"    -> directly countable from a source artifact
#                        "restricted" -> derived by σ restriction of a parent carrier (§2.6/§3.11)
#   numerator_unit       unit of the extensive count (always "counts" for events)
#   restriction          (restricted only) {of_carrier, predicate, conditions}:
#                          of_carrier   primary carrier this event restricts
#                          predicate    §2.6 definition name (documentation)
#                          conditions   declarative AND-list applied by the σ operator:
#                                       [{column, op, value}]; ops: lt|le|gt|ge|eq|ne|in|
#                                       not_in|is_true|is_false|is_not_null (general DSL,
#                                       no per-source code in the engine/executor)
#   ratios               authoritative list of legal RN ratios:
#                          - denominator_carrier  carrier of the denominator
#                            role                 estimand label of the resulting intensive density
#                            output_unit          "rate" (person-time denominator) | "proportion" (event denominator)
#
entries:
- id: sim_all_cause_death_event
  status: active
  source_system: SIM-DO
  event_carrier: Deaths
  event_kind: primary
  numerator_unit: counts
  denominator_carriers:
  - Population
  - LiveBirths
  default_aggregation: additive
  allowed_rates:
  - mortality_rate
  ratios:
  - {denominator_carrier: Population, role: mortality_rate, output_unit: rate}
  warnings: []
  description: All-cause death event (SIM-DO). Source-countable primary event carrier.

