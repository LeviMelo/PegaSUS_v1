# --- Observer-process events (MSD §3.10.6) -----------------------------------
# Data-quality / measurement-process σ-restrictions of Deaths, divided by all-cause
# Deaths to form observer shares (the denominator is the same source's total count).

- id: ill_defined_cause_event
  status: active
  source_system: SIM-DO
  event_carrier: IllDefinedDeaths
  event_kind: restricted
  numerator_unit: counts
  restriction:
    of_carrier: Deaths
    predicate: ill_defined_cause
    conditions:
    - {column: underlying_icd_parse_state, op: eq, value: ill-defined}
  denominator_carriers:
  - Deaths
  default_aggregation: additive
  allowed_rates:
  - observer_share
  ratios:
  - {denominator_carrier: Deaths, role: observer_share, output_unit: proportion}
  warnings: [observer_process_field_not_outcome]
  description: Ill-defined-cause death share (R-codes / all deaths) (§3.10.6 V_O05).

- id: invalid_icd_event
  status: active
  source_system: SIM-DO
  event_carrier: InvalidICDDeaths
  event_kind: restricted
  numerator_unit: counts
  restriction:
    of_carrier: Deaths
    predicate: invalid_icd
    conditions:
    - {column: underlying_icd_parse_state, op: in, value: [invalid, unparseable, blank, missing]}
  denominator_carriers:
  - Deaths
  default_aggregation: additive
  allowed_rates:
  - observer_share
  ratios:
  - {denominator_carrier: Deaths, role: observer_share, output_unit: proportion}
  warnings: [observer_process_field_not_outcome]
  description: Invalid/unparseable underlying-ICD share / all deaths (§3.10.6 V_O06).

- id: missing_race_event
