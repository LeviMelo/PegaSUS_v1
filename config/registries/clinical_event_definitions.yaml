  description: Hospital admission event (SIH-RD). Source-countable primary event carrier.

- id: cnes_facility_capacity_event
  status: active
  source_system: CNES-ST
  event_carrier: Facilities
  event_kind: primary
  numerator_unit: counts
  denominator_carriers:
  - Population
