  allowed_rates:
  - facility_density
  ratios:
  - {denominator_carrier: Population, role: facility_density, output_unit: rate}
  warnings:
  - capacity_snapshot_period_semantics
  description: Facility capacity event (CNES-ST). Source-countable primary event carrier.

# --- Restricted clinical events (MSD §2.6, §3.10.4) ---------------------------
# Derived by σ restriction of a parent carrier. They are NOT directly countable
# from a raw artifact; a restriction operator produces the carrier, after which
# the RN ratios below apply with the correct (live-birth / admission) denominator.

- id: infant_death_event
  status: active
  source_system: SIM-DO
  event_carrier: InfantDeaths
  event_kind: restricted
  numerator_unit: counts
  restriction:
    of_carrier: Deaths
    predicate: infant_death
    conditions:
    - {column: age_days, op: ge, value: 0}
    - {column: age_days, op: lt, value: 365.25}
    - {column: death_type, op: not_in, value: ["1", "fetal", "obito_fetal", "óbito fetal"]}
  denominator_carriers:
  - LiveBirths
  default_aggregation: additive
  allowed_rates:
  - infant_mortality
  ratios:
  - {denominator_carrier: LiveBirths, role: infant_mortality, output_unit: proportion}
  warnings: []
  description: Infant death (AgeDays < 365.25, liveborn). Denominator is live births (§2.6.2).

- id: neonatal_death_event
  status: active
  source_system: SIM-DO
  event_carrier: NeonatalDeaths
  event_kind: restricted
  numerator_unit: counts
  restriction:
    of_carrier: Deaths
    predicate: neonatal_death
    conditions:
    - {column: age_days, op: ge, value: 0}
    - {column: age_days, op: lt, value: 28}
    - {column: death_type, op: not_in, value: ["1", "fetal", "obito_fetal", "óbito fetal"]}
  denominator_carriers:
  - LiveBirths
  default_aggregation: additive
  allowed_rates:
  - neonatal_mortality
  ratios:
  - {denominator_carrier: LiveBirths, role: neonatal_mortality, output_unit: proportion}
  warnings: []
  description: Neonatal death (AgeDays < 28, liveborn). Denominator is live births (§2.6.3).

