    source_columns:
      SIM-DO: age_years
      SINASC: maternal_age_years
      SIH-RD: age_years
    source_maps:
      SIDRA: {'6557': age_0, '6558': age_1, '6559': age_2, '6560': age_3, '6561': age_4, '6562': age_5, '6563': age_6, '6564': age_7, '6565': age_8, '6566': age_9, '6567': age_10, '6568': age_11, '6569': age_12, '6570': age_13, '6571': age_14, '6572': age_15, '6573': age_16, '6574': age_17, '6575': age_18, '6576': age_19, '6577': age_20, '6578': age_21, '6579': age_22, '6580': age_23, '6581': age_24, '6582': age_25, '6656': age_26, '6657': age_27, '6658': age_28, '6659': age_29, '6583': age_30, '6584': age_31, '6585': age_32, '6586': age_33, '6587': age_34, '6588': age_35, '6589': age_36, '6590': age_37, '6591': age_38, '6592': age_39, '6593': age_40, '6594': age_41, '6595': age_42, '6596': age_43, '6597': age_44, '6598': age_45, '6599': age_46, '6600': age_47, '6601': age_48, '6602': age_49, '6603': age_50, '6604': age_51, '6605': age_52, '6606': age_53, '6607': age_54, '6608': age_55, '6609': age_56, '6610': age_57, '6611': age_58, '6612': age_59, '6613': age_60, '6614': age_61, '6615': age_62, '6616': age_63, '6617': age_64, '6618': age_65, '6619': age_66, '6620': age_67, '6621': age_68, '6622': age_69, '6623': age_70, '6624': age_71, '6625': age_72, '6626': age_73, '6627': age_74, '6628': age_75, '6629': age_76, '6630': age_77, '6631': age_78, '6632': age_79, '6633': age_80, '6634': age_81, '6635': age_82, '6636': age_83, '6637': age_84, '6638': age_85, '6639': age_86, '6640': age_87, '6641': age_88, '6642': age_89, '6643': age_90, '6644': age_91, '6645': age_92, '6646': age_93, '6647': age_94, '6648': age_95, '6649': age_96, '6650': age_97, '6651': age_98, '6652': age_99, '6653': age_100_plus, '0': __total__, '100362': __total__}
