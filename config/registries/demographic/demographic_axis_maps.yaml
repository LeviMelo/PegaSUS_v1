schema_version: '1.0'
registry_version: v1.0
created_at: '2026-06-26'
provenance: >-
  Canonical demographic-axis category maps (MSD §2.12.2 classification projection,
  §3.7.4 sex/race alignment). Aligns source-specific category codes (DATASUS, SIDRA)
  onto shared canonical axis categories so stratified numerators (deaths by sex) and
  denominators (population by sex) join on the same axis. Registry-driven: adding a
  source or axis is a registry edit, not engine code.
#
# Special canonical targets:
#   __total__    aggregate category (e.g. SIDRA "Total") — excluded from a stratified
#                axis (it is the marginal, not a stratum)
#   __unknown__  missing/ignored category — excluded from stratified rates, counted as
#                missingness
#
# SIDRA classification id -> canonical demographic axis name (§2.12.2 projection target).
classification_axis:
  '2': sex
  '86': race
  '287': age_group

axes:
  sex:
    canonical_categories: [male, female]
    # Normalized event column carrying this axis, per source (for stratifying event counts).
    # NOTE: SINASC's normalizer names this column for the newborn specifically
    # (population entry at age 0, MSD §2.8.5), not a generic "sex" column.
    source_columns:
      SIM-DO: sex
      SINASC: newborn_sex
      SIH-RD: sex
    source_maps:
      SIM-DO:   {'1': male, '2': female, '0': __unknown__, '9': __unknown__}
      SINASC:   {'1': male, '2': female, '0': __unknown__, '9': __unknown__}
      SIH-RD:   {'1': male, '2': female, '0': __unknown__, '3': __unknown__}
      SIDRA:    {'4': male, '5': female, '0': __total__, '6794': __total__}
  race:
    canonical_categories: [branca, preta, amarela, parda, indigena]
    # No SIM-DO/SINASC/SIH-RD source_maps below: administrative race/color
    # declaration-process semantics are NOT compatible with IBGE self-declared
    # census race (MSD §3.7.4) -- a direct code->category crosswalk here would be
    # silent redistribution. DATASUS admin race must instead go through
    # pegasus.efg.race_bridge (Bridge_R), never through map_category().
    source_columns:
      SIM-DO: race_color_admin
      SINASC: newborn_race_admin
      SIH-RD: race_color_billing
    source_maps:
      SIDRA: {'2776': branca, '2777': preta, '2778': amarela, '2779': parda, '2780': indigena, '0': __total__, '95251': __total__}
  age_group:
    # Non-overlapping SIDRA 9606 census basis: single-year categories plus 100+.
    # Overlapping 5-year parent categories remain unmapped unless an allocation kernel is declared.
