schema_version: '1.0'
registry_version: v3.0
created_at: '2026-06-06'
updated_at: '2026-06-27'
provenance: Macro-Slice 22A population solver registry.
entries:
- id: projected_gradient_small_v1
  description: Analytic projected-gradient optimizer for small independent population tensors.
  mode: independent_denominator
  backend: projected_gradient_small_sparse_analytic
  status: active
  sparse_jacobian: true
  max_cells: 10000000
  warnings: []
- id: projected_gradient_small_sim_informed_v1
  description: Analytic projected-gradient optimizer with an explicit SIM death-prior term and feedback warning.
  mode: sim_informed_denominator
  backend: projected_gradient_small_sparse_analytic
  status: active_warning
  sparse_jacobian: true
  max_cells: 10000000
  warnings:
  - sim_informed_population_feedback_risk
- id: independent_sidra_anchor_v1
  description: Legacy identity path retained only for reproducibility of earlier runs.
  mode: independent_denominator
  backend: algebraic_sidra_anchor_identity
  status: legacy_identity
  sparse_jacobian: true
  max_cells: 10000000
  warnings:
  - legacy_identity_solver
- id: sparse_block_coordinate_v1
  description: Memory-preflighted sparse block-coordinate optimizer for regional and national independent tensors.
  mode: independent_denominator
  backend: sparse_block_coordinate_analytic
  status: active_sparse
  sparse_jacobian: true
  max_cells: 250000000
  warnings: []
- id: sparse_block_coordinate_sim_informed_v1
  description: Sparse block-coordinate optimizer with explicit SIM death-prior feedback warning.
  mode: sim_informed_denominator
  backend: sparse_block_coordinate_analytic
  status: active_sparse_warning
  sparse_jacobian: true
  max_cells: 250000000
  warnings:
  - sim_informed_population_feedback_risk
- id: state_space_smoother_reduced_v1
  description: Reduced UF/region Kalman/RTS-style state-space smoother over cohort paths.
  mode: independent_denominator
  backend: state_space_smoother_reduced_rts
  status: active_reduced
  sparse_jacobian: true
  max_cells: 10000000
  warnings:
  - reduced_population_state_space_path
- id: sim_informed_sparse_admm_v1
  description: Split-projection sparse ADMM optimizer with explicit SIM death-prior feedback warning.
  mode: sim_informed_denominator
  backend: sparse_admm_split_projection
  status: active_sparse_warning
  sparse_jacobian: true
  max_cells: 250000000
  warnings:
  - sim_informed_population_feedback_risk
