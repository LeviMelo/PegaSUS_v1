schema_version: "1.0"
registry_version: "race_bridge_priors.v1.slice4b"
created_at: "2026-06-10"
updated_at: "2026-07-01"
provenance: "Bridge_R local-pi posterior prior registry (admin DATASUS race/color -> IBGE self-declared census race). The default is an IDENTITY baseline (admin taken as self-declared, the standard when no record linkage exists); it is honest but uncalibrated -- swap in a linkage-derived emission matrix for reclassification-corrected estimates. The smoke fixture is retained (disabled) for compiler-validation tests only."
entries:
  - id: "identity_admin_as_selfdeclared_v1"
    status: "baseline"
    description: "Identity emission baseline: administrative race taken as self-declared (no reclassification correction). Default national-scope prior; missing race reallocated to the local self-declared composition."
    warnings:
      - "race_prior_uncalibrated_identity_baseline"
      - "admin_race_reclassification_not_modeled"
      - "raw_administrative_counts_must_be_preserved"
    source_system: "SIM-DO"
    source_axis: "SIM_ADMIN_RACACOR"
    target_axis: "IBGE_SELF_DECLARED_RACE"
    mode: "localPi_posteriorC"
    prior_path: "config/priors/race_bridge/identity_admin_as_selfdeclared_v1.json"
    enabled_for_compile: true
    region_scope:
      - "*"
    period_start: 2000
    period_end: 2100
    dashboard_policy: "downgrade_when_sensitive"
  - id: "fixedC_sim_admin_to_ibge_selfdeclared_smoke_v1"
    status: "experimental"
    description: "Smoke local-pi posterior bridge from SIM administrative race/color to IBGE self-declared race axis (compiler-validation fixture only)."
    warnings:
      - "fixture_prior_not_calibrated"
      - "posterior_fields_are_sensitivity_observers"
      - "raw_administrative_counts_must_be_preserved"
    source_system: "SIM-DO"
    source_axis: "SIM_ADMIN_RACACOR"
    target_axis: "IBGE_SELF_DECLARED_RACE"
    mode: "localPi_posteriorC"
    prior_path: "config/priors/race_bridge/fixedC_sim_admin_to_ibge_selfdeclared_v1.json"
    enabled_for_compile: false
    region_scope:
      - "AL"
    period_start: 2022
    period_end: 2022
    dashboard_policy: "downgrade_when_sensitive"
