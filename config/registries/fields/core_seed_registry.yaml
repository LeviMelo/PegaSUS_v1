schema_version: '1.0'
registry_version: v1.0
created_at: '2026-06-26'
provenance: >-
  MSD §3.10 Core Seed Registry. Binds the canonical core-seed IDs (V_M*/V_H*/V_B*/
  V_C*/V_K*) and the count-level admission seeds an intent may contract for to the
  EFG fields actually produced, via a declarative match predicate. This is what makes
  intent `mandatory_fields` resolve and be enforced against real output — closing the
  §3.10 contract without renaming content-addressed field ids. Registry-driven: adding
  a seed is a registry edit, not engine code.
#
# match predicate keys (AND-combined), evaluated against a produced FieldNode:
#   role             token that must appear in field.role (e.g. the RN ratio role)
#   carrier          exact field.carrier
#   requires_axis    axis key that must be present in field.axes
#   excludes_axes    none of these axis keys may be present in field.axes
#   restrict_predicate  field.support.restrict_predicate must equal this
#   population       true -> field.role must contain "population_tensor"
#
entries:
# --- §3.10.1 Mortality (rate estimands) ---
- {id: V_M01, name: CrudeMortality, aliases: [SIMCrudeMortalitySIDRAOfficial],
   match: {role: mortality_rate, excludes_axes: [icd_chapter, icd_block]}}
- {id: V_M02, name: ChapterMortality, aliases: [],
   match: {role: mortality_rate, requires_axis: icd_chapter}}
- {id: V_M03, name: BlockMortality, aliases: [],
   match: {role: mortality_rate, requires_axis: icd_block}}
- {id: V_M04, name: CuratedCauseMortality, aliases: [],
   match: {role: mortality_rate, requires_axis: curated_cause_group}}
# --- §3.10.2 Hospitalization ---
- {id: V_H01, name: CrudeHospitalization, aliases: [],
   match: {role: hospitalization_rate, excludes_axes: [icd_chapter, icd_block]}}
- {id: V_H02, name: DiagnosisHospitalization, aliases: [],
   match: {role: hospitalization_rate, requires_axis: icd_chapter}}
- {id: V_H03, name: InpatientFatality, aliases: [SIHInpatientFatality],
   match: {role: inpatient_mortality}}
# --- §3.10.3 Fertility and Birth ---
- {id: V_B01, name: CrudeBirthRate, aliases: [SINASCCrudeBirthRateSIDRAOfficial],
   match: {role: birth_rate}}
# --- §3.10.4 Maternal-Child ---
- {id: V_C01, name: InfantMortality, aliases: [SIMInfantMortalitySINASCBirths],
   match: {role: infant_mortality}}
- {id: V_C02, name: NeonatalMortality, aliases: [SIMNeonatalMortalitySINASCBirths],
   match: {role: neonatal_mortality}}
- {id: V_C03, name: PostNeonatalMortality, aliases: [SIMPostNeonatalMortalitySINASCBirths],
   match: {role: postneonatal_mortality}}
- {id: V_C06, name: LowBirthWeight, aliases: [SINASCLowBirthWeightPrevalence],
   match: {role: birth_outcome_share, carrier: LowBirthWeightBirths/LiveBirths}}
- {id: V_C08, name: PrematurityShare, aliases: [SINASCPrematurityPrevalence],
   match: {role: birth_outcome_share, carrier: PrematurityBirths/LiveBirths}}
- {id: V_C14, name: CongenitalAnomaly, aliases: [SINASCCongenitalAnomalyPrevalence],
   match: {role: birth_outcome_share, carrier: CongenitalAnomalyBirths/LiveBirths}}
- {id: V_C09, name: CesareanShare, aliases: [],
   match: {role: birth_outcome_share, carrier: CesareanBirths/LiveBirths}}
- {id: V_C10, name: LowApgar1, aliases: [],
   match: {role: birth_outcome_share, carrier: LowApgar1Births/LiveBirths}}
- {id: V_C11, name: LowApgar5, aliases: [],
   match: {role: birth_outcome_share, carrier: LowApgar5Births/LiveBirths}}
# --- §3.10.5 Capacity ---
- {id: V_K04, name: FacilityDensity, aliases: [],
   match: {role: facility_density}}
# --- §3.10.5 Health-system statistical functionals (Ψ_mean) ---
- {id: V_K05, name: MeanLengthOfStay, aliases: [], match: {role: mean_length_of_stay}}
- {id: V_K06, name: ICUDaysPerHosp, aliases: [], match: {role: mean_icu_days}}
- {id: V_K07A, name: MeanHospitalServiceCost, aliases: [], match: {role: mean_hospital_service_cost}}
- {id: V_K07B, name: MeanProfessionalCost, aliases: [], match: {role: mean_professional_cost}}
- {id: V_K07C, name: MeanICUCost, aliases: [], match: {role: mean_icu_cost}}
- {id: V_K07D, name: MeanTotalBillingCost, aliases: [], match: {role: mean_total_billing_cost}}
# --- §3.10.6 Observer-process functionals (Ψ_median) ---
- {id: V_O01, name: ReportingDelaySIM, aliases: [], match: {role: median_reporting_delay}}
# --- §3.10.6 Observer-process fields (data-quality shares; disambiguated by carrier) ---
- {id: V_O04, name: InvestigationShare, aliases: [],
   match: {role: observer_share, carrier: InvestigatedDeaths/Deaths}}
- {id: V_O05, name: IllDefinedCauseShare, aliases: [],
   match: {role: observer_share, carrier: IllDefinedDeaths/Deaths}}
- {id: V_O06, name: InvalidICDShare, aliases: [],
   match: {role: observer_share, carrier: InvalidICDDeaths/Deaths}}
- {id: V_O07, name: MissingRaceShare, aliases: [],
   match: {role: observer_share, carrier: MissingRaceDeaths/Deaths}}
# --- §2.11 Cross-source divergence relationships (bridge surface) ---
- {id: MorbidityMortalityDivergence, name: MorbidityMortalityDivergence, aliases: [],
   match: {role: morbidity_mortality_divergence, excludes_axes: [icd_chapter, icd_block, curated_cause_group]}}
- {id: CauseMorbidityMortalityDivergence, name: CauseMorbidityMortalityDivergence, aliases: [],
   match: {role: morbidity_mortality_divergence, requires_axis: icd_chapter}}
- {id: FertilityMortalityDivergence, name: FertilityMortalityDivergence, aliases: [],
   match: {role: fertility_mortality_divergence}}
# --- Count-level admission seeds (numerators / anchors an intent may mandate) ---
- {id: SIMDeathsAll, name: SIMDeathsAll, aliases: [],
   match: {carrier: Deaths, role: source_event_count, excludes_axes: [icd_chapter, icd_block]}}
- {id: SINASCLiveBirthsAll, name: SINASCLiveBirthsAll, aliases: [],
   match: {carrier: LiveBirths, role: source_event_count, excludes_axes: [icd_chapter, icd_block]}}
- {id: SIHHospitalAdmissionsAll, name: SIHHospitalAdmissionsAll, aliases: [],
   match: {carrier: HospitalAdmissions, role: source_event_count, excludes_axes: [icd_chapter, icd_block]}}
- {id: CNESFacilitiesAll, name: CNESFacilitiesAll, aliases: [],
   match: {carrier: Facilities, role: source_event_count}}
- {id: SIHInpatientDeaths, name: SIHInpatientDeaths, aliases: [],
   match: {carrier: HospitalDeaths, role: source_event_count}}
- {id: SIDRAPopulationTotalAnchor, name: SIDRAPopulationTotalAnchor, aliases: [],
   match: {population: true}}
