schema_version: '1.0'
registry_version: v1.0
created_at: '2026-06-27'
provenance: >-
  Statistical-functional fields (MSD §3.10.4–§3.10.6: Ψ_mean / Ψ_median operators).
  Each entry declares a per-record numeric "mark" column on a source event carrier and
  the functional to apply over a support cell (year × municipality). These are intensive
  marked_functional fields (not extensive counts, not RN ratios) — covariates for PIRS.
  Source-agnostic: adding a functional is a registry edit, not engine code.
#
# entry contract:
#   id            stable functional id
#   source_system source whose event records carry the mark
#   carrier       event carrier the mark belongs to (must be a primary event carrier)
#   mark_column   normalized per-record numeric column
#   functional    "mean" | "median"
#   unit          output unit (days | BRL | ...)
#   role          estimand label
#
entries:
- {id: mean_length_of_stay, source_system: SIH-RD, carrier: HospitalAdmissions,
   mark_column: stay_length_days, functional: mean, unit: days, role: mean_length_of_stay}
- {id: mean_icu_days_per_hospitalization, source_system: SIH-RD, carrier: HospitalAdmissions,
   mark_column: icu_days_hospitalization_total, functional: mean, unit: days, role: mean_icu_days}
- {id: mean_hospital_service_cost, source_system: SIH-RD, carrier: HospitalAdmissions,
   mark_column: hospital_service_cost_real, functional: mean, unit: BRL, role: mean_hospital_service_cost}
- {id: mean_professional_service_cost, source_system: SIH-RD, carrier: HospitalAdmissions,
   mark_column: professional_service_cost_real, functional: mean, unit: BRL, role: mean_professional_cost}
- {id: mean_icu_cost, source_system: SIH-RD, carrier: HospitalAdmissions,
   mark_column: icu_cost_real, functional: mean, unit: BRL, role: mean_icu_cost}
- {id: mean_total_billing_cost, source_system: SIH-RD, carrier: HospitalAdmissions,
   mark_column: total_admission_cost_real, functional: mean, unit: BRL, role: mean_total_billing_cost}
- {id: median_reporting_delay_sim, source_system: SIM-DO, carrier: Deaths,
   mark_column: reporting_delay, functional: median, unit: days, role: median_reporting_delay}
