schema_version: '1.0'
registry_version: v1.0
created_at: '2026-06-27'
provenance: >-
  Curated ICD-10 cause groups (MSD §3.11 G_curated) for cause-specific mortality
  (V_M04 CuratedCauseMortality). These are epidemiologically meaningful underlying-cause
  groups (major NCDs, infections, external causes, maternal/perinatal), each a union of
  3-char ICD-10 intervals. Codes outside every group fall to the explicit OTHER residual
  so the σ_C restriction still partitions the death population exactly. Registry-driven:
  curating the cause list is a registry edit, not engine code.
#
# entry: {id, label, ranges: [[start3, end3], ...]} on 3-char ICD-10 codes (inclusive).
#
