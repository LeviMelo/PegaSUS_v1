- id: glm_binomial_proportion
  status: active
  family: binomial_proportion
  residual_type: deviance
  required_artifacts:
  - pirs_design_matrix_manifest
  outputs:
  - coefficients
  - fitted_values
  - residual_values
  warnings:
  - bounded_proportion_family
  description: Logit GLM for bounded proportions.
- id: glm_beta_binomial
  status: active_reduced
  family: beta_binomial
  residual_type: pearson
  required_artifacts:
  - pirs_design_matrix_manifest
  outputs:
  - coefficients
  - fitted_values
  - residual_values
  warnings:
  - overdispersed_proportion_family
  - beta_binomial_intraclass_correlation_estimated
  - reduced_fits_binomial_mean_with_overdispersion_approximation
  description: >
    Overdispersed bounded-proportion model. Fits a binomial-mean GLM, then estimates
    an intraclass correlation (rho) via method-of-moments and applies it to Pearson
    residuals. Not a full beta-binomial maximum-likelihood fit; marked active_reduced
    accordingly.
- id: glm_dirichlet
  status: active_reduced
  family: dirichlet
  residual_type: ilr
  required_artifacts:
  - pirs_design_matrix_manifest
  outputs:
  - coefficients
  - fitted_values
  - residual_values
  warnings:
  - simplex_softmax_mean_model
  - reduced_softmax_approximation_not_full_dirichlet_concentration
  description: >
    Simplex/compositional outcome model using softmax mean parameterization. Not a
    full Dirichlet concentration MLE; concentration/precision parameters are not
    estimated. Marked active_reduced.
- id: glm_multinomial_logit
