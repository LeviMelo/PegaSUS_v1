schema_version: '1.0'
registry_version: v3.0
created_at: '2026-06-06'
updated_at: '2026-06-27'
provenance: Registry reconciled with pegasus.compute.glm family support and MSD §6.2 planned family surface.
entries:
- id: glm_gaussian_identity
  status: active
  family: gaussian_identity
  residual_type: standardized
  required_artifacts:
  - pirs_design_matrix_manifest
  outputs:
  - coefficients
  - fitted_values
  - residual_values
  warnings: []
  description: Gaussian identity-link GLM for continuous outcomes.
