- id: glm_student_t
  status: active_reduced
  family: student_t
  residual_type: standardized
  required_artifacts:
  - pirs_design_matrix_manifest
  outputs:
  - coefficients
  - fitted_values
  - residual_values
  warnings:
  - robust_iteratively_reweighted_t_kernel
  - reduced_iteratively_reweighted_gaussian_not_full_t_likelihood
  description: >
    Robust iteratively reweighted model using Huber/t-like weights. Does not maximize
    a full Student-t log-likelihood with estimated degrees-of-freedom. Marked
    active_reduced pending proper df/scale estimation.
