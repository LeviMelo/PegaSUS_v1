schema_version: '1.0'
registry_version: v2.0
created_at: '2026-06-06'
updated_at: '2026-07-01'
provenance: >
  Multi-table SIDRA cube stitching policy. A "synthetic SIDRA cube" combines more
  than one SIDRA table's period coverage into one coherent time series when no
  single table spans the run window -- e.g. the population denominator tensor
  (MSD §2.8, pegasus.sidra.population_cube). This registry documents WHICH tables
  play which role and the conflict-resolution rule; it deliberately does NOT
  hardcode gap/exclusion years -- each table's own live SIDRA `periods` metadata
  is trusted directly by the acquisition code, so a resumed estimate or a new
  census year needs no registry edit.
entries:
- id: population_cube_9606_6579
  status: active
  description: >
    Population denominator tensor (MSD §2.8.10 closure source, E_{s,t}): table
    9606 (Census demographic matrix; sex x race x age; census years only)
    supplies the full disaggregation; table 6579 (post-censal estimates; total
    population only) supplies intercensal-year totals so the tensor's per-year
    closure constraint has real anchoring data across the whole run window, not
    just census years. Implemented in pegasus.sidra.population_cube (anchor.py
    loads each table; build.py stitches them; pegasus.workflows.pipeline acquires
    both across the intent's full year window).
  warnings: []
  cube: population_denominator_tensor
  tables:
  - table_id: '9606'
    role: disaggregated_census_anchor
    variable_id: '93'
    coverage: census_years_only
    provides: sex_race_age_disaggregation_and_total
  - table_id: '6579'
    role: intercensal_total_anchor
    variable_id: '9324'
    coverage: intercensal_years
    provides: total_only
  conflict_resolution: prefer_9606_when_both_cover_the_same_year
  known_data_gaps_verified_live_2026_07_01:
  - year: 2007
    reason: ibge_estimation_gap_no_official_6579_value_published
  - year: 2023
    reason: post_2022_census_processing_lag_6579_not_yet_resumed
