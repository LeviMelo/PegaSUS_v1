name: pegasus

channels:
  - pytorch
  - nvidia
  - conda-forge
  - defaults

dependencies:
  - python=3.11
  - pip
  - pytorch
  - pytorch-cuda=12.1
  - numpy
  - scipy
  - pandas
  - polars
  - pyarrow
  - duckdb
  - pydantic>=2
  - pydantic-settings
  - typer
  - rich
  - pyyaml
  - httpx
  - aiofiles
  - tenacity
  - orjson
  - loguru
  - tqdm
  - networkx
  - geopandas
  - shapely
  - pyproj
  - pytest
  - ruff
  - mypy

  - pip:
      - python-dotenv