[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pegasus"
version = "0.1.0"
description = "PegaSUS evidence-field epidemiological compiler"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.7",
  "typer>=0.12",
  "PyYAML>=6.0",
  "rich>=13.7",
  "duckdb>=1.0",
  "polars>=1.0",
  "pyarrow>=16.0",
  # Numerical core: the LDO inference engine (pirs/ldo/*) and the population/CTR
  # solvers require these at runtime — they are NOT optional. sklearn backs the
  # graphical-lasso precision; scipy backs sparse linear algebra.
  "numpy>=1.26",
  "scipy>=1.11",
  "scikit-learn>=1.4"
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.5", "mypy>=1.10"]
gpu = ["torch>=2.4"]
# Disease Semantic Axis (MSD-II §II.13): deterministic ICD/CID hierarchy + multi-label
# groupers. Embedding build (Qwen3, §II.13.4) is a separate, offline, optional step.
disease = ["simple-icd-10>=2.1", "icd-mappings>=0.6", "scipy>=1.11"]

[project.scripts]
pegasus = "pegasus.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
